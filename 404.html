<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Off chart — RouteGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Newsreader:ital,opsz,wght@1,6..72,400&family=Saira+Stencil+One&family=Schibsted+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #05080d; --panel: #0b0f17; --rule: #1e293b; --ink: #e2e8f0; --ink-2: #a3b0c3; --ink-3: #7c8aa0; --signal: #e85ca8; --hazard: #f26e40; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg: #e7e2d3; --panel: #fbfaf6; --rule: #d8d1bf; --ink: #161b24; --ink-2: #485062; --ink-3: #636b7a; --signal: #a3166e; --hazard: #c2410c; color-scheme: light; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 'Schibsted Grotesk', system-ui, sans-serif;
      background-image: linear-gradient(rgba(120,140,170,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(120,140,170,.07) 1px, transparent 1px); background-size: 48px 48px; }
    main { width: min(520px, 100%); border: 1px solid var(--rule); border-top: 3px solid var(--ink); background: var(--panel); padding: 24px; box-shadow: 6px 6px 0 rgba(0,0,0,.4); }
    .k { font: 600 10px 'Martian Mono', monospace; letter-spacing: .04em; color: var(--hazard); text-transform: uppercase; }
    h1 { font: italic 400 34px/1.1 'Newsreader', Georgia, serif; margin: 8px 0 10px; }
    p { color: var(--ink-2); margin: 0 0 18px; }
    .pos { font: 400 26px/1 'Saira Stencil One', monospace; letter-spacing: .04em; margin: 0 0 18px; }
    svg { display: block; width: 100%; height: auto; margin: 0 0 18px; }
    a { display: inline-flex; padding: 9px 14px; background: var(--ink); color: var(--panel); text-decoration: none; font-weight: 600; }
    a:hover { box-shadow: 3px 3px 0 var(--ink-3); transform: translate(-1px,-1px); }
  </style>
</head>
<body>
  <main>
    <div class="k">Error 404 · position unknown</div>
    <h1>You have sailed off the chart.</h1>
    <svg viewBox="0 0 400 90" aria-hidden="true">
      <path d="M10 70 L120 30 L210 55" fill="none" stroke="var(--signal)" stroke-width="3"/>
      <circle cx="120" cy="30" r="6" fill="var(--panel)" stroke="var(--signal)" stroke-width="2"/>
      <path d="M210 55 L390 20" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="2 6"/>
      <path d="M300 22 l14 14 l-14 14 l-14 -14 z" fill="var(--hazard)"/>
      <text x="300" y="80" text-anchor="middle" font-family="Martian Mono, monospace" font-size="10" fill="var(--ink-3)">?? °N ?? °E</text>
    </svg>
    <p class="pos">DR ??°N ??°E</p>
    <p>No hub, corridor or page exists at this address. Return to the passage chart to plot a fresh track.</p>
    <a href="./">Return to the chart</a>
  </main>
</body>
</html>
